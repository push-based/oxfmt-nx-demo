# Git hooks for the oxfmt demo workspace.
#
# The router reads the staged-file list from git itself (`--staged`) rather than taking it
# as argv. Lefthook expands `{staged_files}` space-separated, which a single
# `--files=a,b,c` argument cannot absorb once the shell has split it — `--staged` sidesteps
# the quoting problem entirely. The `glob` below only decides *whether* the job runs.
# See tools/scripts/format/format.mjs.
#
# Refer to https://lefthook.dev/configuration/ for all options.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob:
        - '*.ts'
        - '*.js'
        - '*.mjs'
        - '*.json'
        - '*.html'
        - '*.scss'
        - '*.css'
        - '*.md'
        - '*.yml'
        - '*.yaml'
      run: node tools/scripts/format/format.mjs write --staged
      stage_fixed: true
