# Git hooks for the oxfmt demo workspace.
#
# One formatter now, so the hook calls it directly on the staged files. The `glob`
# below only decides *whether* the job runs; oxfmt's own config decides how each
# file is parsed (see `associations` in .oxfmtrc.json).
#
# Refer to https://lefthook.dev/configuration/ for all options.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob:
        - '*.ts'
        - '*.js'
        - '*.mjs'
        - '*.json'
        - '*.html'
        - '*.scss'
        - '*.css'
        - '*.md'
        - '*.yml'
        - '*.yaml'
      run: npx oxfmt --write {staged_files}
      stage_fixed: true
