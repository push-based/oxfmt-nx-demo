# Git hooks for the oxfmt demo workspace.
#
# The hook hands its staged-file list to the router, which splits the list between
# oxfmt and Prettier and skips whichever formatter has nothing to do.
# See tools/scripts/format/format.mjs.
#
# Refer to https://lefthook.dev/configuration/ for all options.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob:
        - '*.ts'
        - '*.js'
        - '*.mjs'
        - '*.json'
        - '*.html'
        - '*.scss'
        - '*.css'
        - '*.md'
        - '*.yml'
        - '*.yaml'
      run: node tools/scripts/format/format.mjs {staged_files}
      stage_fixed: true
