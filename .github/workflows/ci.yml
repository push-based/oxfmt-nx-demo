name: CI

on:
  push:
    branches:
      - main
      - oxfmt-hybrid
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      # The formatting gate this repository is about. On `main` this is Prettier
      # over the whole workspace; on `oxfmt-hybrid` the same script routes files
      # between oxfmt and Prettier.
      - run: yarn format:check

      - run: npx nx run-many -t lint test build typecheck
