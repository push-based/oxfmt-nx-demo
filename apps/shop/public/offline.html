<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Nx Shop Demo</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        color: #2c3e50;
      }
      .panel {
        text-align: center;
        max-width: 32rem;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>You're offline</h1>
      <p>
        The shop needs a connection to load products. Reconnect and try again.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
