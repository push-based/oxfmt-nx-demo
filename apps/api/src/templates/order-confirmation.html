<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Order confirmation</title>
  </head>
  <body
    style="margin: 0; padding: 24px; font-family: Arial, Helvetica, sans-serif"
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
          >
            <tr>
              <td style="padding-bottom: 16px">
                <h1 style="margin: 0; font-size: 20px">
                  Thanks for your order
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 16px">
                <p style="margin: 0">
                  Order <strong>{{orderId}}</strong> is confirmed. We'll email
                  you again when it ships.
                </p>
              </td>
            </tr>
            <tr>
              <td>
                <a
                  href="{{orderUrl}}"
                  style="
                    background: #2c3e50;
                    color: #ffffff;
                    padding: 12px 20px;
                    text-decoration: none;
                    border-radius: 4px;
                    display: inline-block;
                  "
                  >View your order</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
